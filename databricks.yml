# Declarative Automation Bundle for Amiga Bricks.
#
#   databricks bundle validate --strict -t dev --profile <profile>
#   databricks bundle deploy -t dev --profile <profile>
#   databricks bundle run amiga_bricks -t dev --profile <profile>
#
# Override the volume per target or on the command line, e.g.
#   databricks bundle deploy -t prod --var volume=main.games.amiga
bundle:
  name: amiga-bricks

variables:
  volume:
    description: Unity Catalog volume (catalog.schema.volume) holding roms/, games/ and screenshots/
    default: andrew.default.amiga

resources:
  apps:
    amiga_bricks:
      name: amiga-bricks
      description: Web-based Commodore Amiga emulator (EmulatorJS + PUAE) backed by a Unity Catalog volume
      source_code_path: .
      # The Files plugin runs on behalf of the signed-in user, so the app needs
      # the user's token scoped for the Files API.
      user_api_scopes:
        - files.files
      resources:
        # Exposed to the app as DATABRICKS_VOLUME_FILES (`valueFrom: files` in
        # app.yaml), resolving to /Volumes/<catalog>/<schema>/<volume>.
        - name: files
          description: Kickstart ROMs, disk images and screenshots
          uc_securable:
            securable_full_name: ${var.volume}
            securable_type: VOLUME
            permission: WRITE_VOLUME
      permissions:
        - level: CAN_USE
          group_name: users

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    # One shared copy of the production deployment, under the deployer's home.
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
